<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" role="img" aria-label="stylized portal">
  <defs>
    <radialGradient id="fire" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#fff5a8" stop-opacity=".08"/>
      <stop offset=".45" stop-color="#ffb13d" stop-opacity=".34"/>
      <stop offset=".72" stop-color="#ff6d1f" stop-opacity=".9"/>
      <stop offset="1" stop-color="#261006" stop-opacity="0"/>
    </radialGradient>
    <filter id="spark">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="130" cy="130" r="112" fill="none" stroke="url(#fire)" stroke-width="23" filter="url(#spark)" stroke-dasharray="20 11 5 13"/>
  <circle cx="130" cy="130" r="82" fill="none" stroke="#ffd27b" stroke-width="5" stroke-opacity=".72" stroke-dasharray="7 15"/>
  <circle cx="130" cy="130" r="124" fill="none" stroke="#ff7b1c" stroke-width="3" stroke-opacity=".48" stroke-dasharray="2 11"/>
</svg>
